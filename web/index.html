<!doctype html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta
			name="description"
			content="Flux — веб-клиент медиа-сервера: видео, аудио и мемы в браузере."
		/>
		<meta name="theme-color" content="#0b0b0f" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
		<link rel="apple-touch-icon" href="/icon-180.png" />
		<title>Flux</title>
		<script>
			(() => {
				try {
					const stored = localStorage.getItem("mantine-color-scheme-value");
					const dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
					const scheme =
						stored === "light" || stored === "dark"
							? stored
							: dark
								? "dark"
								: "light";
					document.documentElement.setAttribute(
						"data-mantine-color-scheme",
						scheme,
					);
				} catch {
					// Приватный режим или отключённое хранилище: Mantine выберет
					// схему сам, вспышка темы не критична.
				}
			})();
		</script>
	</head>
	<body>
		<div id="root"></div>
		<noscript>Для работы Flux нужен JavaScript.</noscript>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
