name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y gcc libc6-dev
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./internal/... -race

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.x'
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Code generation
        run: dart run build_runner build
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        working-directory: ./
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build

  shared-mobile:
    name: Shared & Mobile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint shared
        run: npm run lint -w @flux/shared
      - name: Test shared
        run: npm run test -w @flux/shared
      - name: Typecheck shared and mobile
        run: npm run typecheck -w @flux/shared && npm run typecheck -w mobile
      - name: Lint mobile
        run: npm run lint -w mobile
