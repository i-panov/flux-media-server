name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y gcc libc6-dev
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./internal/... -race

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        working-directory: ./
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Dead code
        run: npm run lint:deadcode
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
      - name: Size budgets
        run: npm run size
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - name: E2E
        run: npm run test:e2e

  shared-mobile:
    name: Shared & Mobile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint shared
        run: npm run lint -w @flux/shared
      - name: Test shared
        run: npm run test -w @flux/shared
      - name: Typecheck shared and mobile
        run: npm run typecheck -w @flux/shared && npm run typecheck -w mobile
      - name: Lint mobile
        run: npm run lint -w mobile
      - name: Test mobile
        run: npm run test -w mobile
      # EXPO_OFFLINE обязателен: online-проверка сверяется с последним
      # bundledNativeModules SDK и флагает уже установленные пакеты как
      # устаревшие; offline использует версию из node_modules/expo и
      # детерминирована в CI.
      - name: Check Expo dependency versions
        working-directory: mobile
        env:
          EXPO_OFFLINE: '1'
        run: npx expo install --check
      - name: Validate Expo config and plugins
        working-directory: mobile
        run: npx expo config --type introspect > /dev/null
      - name: Check mobile version
        run: npm run version:sync -w mobile -- --check
      - name: Smoke export mobile
        working-directory: mobile
        run: npx expo export --platform android --output-dir dist
