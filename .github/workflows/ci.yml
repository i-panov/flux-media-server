name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y gcc libc6-dev
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./internal/... -race

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        working-directory: ./
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Dead code
        run: npm run lint:deadcode
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
      - name: Size budgets
        run: npm run size
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - name: E2E
        run: npm run test:e2e

  shared-mobile:
    name: Shared & Mobile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint shared
        run: npm run lint -w @flux/shared
      - name: Test shared
        run: npm run test -w @flux/shared
      - name: Typecheck shared and mobile
        run: npm run typecheck -w @flux/shared && npm run typecheck -w mobile
      - name: Lint mobile
        run: npm run lint -w mobile
      - name: Test mobile
        run: npm run test -w mobile
      # EXPO_OFFLINE обязателен: online-проверка сверяется с последним
      # bundledNativeModules SDK и флагает уже установленные пакеты как
      # устаревшие; offline использует версию из node_modules/expo и
      # детерминирована в CI.
      - name: Check Expo dependency versions
        working-directory: mobile
        env:
          EXPO_OFFLINE: '1'
        run: npx expo install --check
      - name: Validate Expo config and plugins
        working-directory: mobile
        run: npx expo config --type introspect > /dev/null
      - name: Prebuild Android TV manifest
        working-directory: mobile
        env:
          EXPO_TV: '1'
        run: |
          npx expo prebuild --platform android --no-install
          grep -q "LEANBACK_LAUNCHER" android/app/src/main/AndroidManifest.xml
          grep -q 'System.getenv("FLUX_KEYSTORE_PATH") ? signingConfigs.release' android/app/build.gradle
      - name: Expo doctor
        working-directory: mobile
        env:
          EXPO_OFFLINE: '1'
        run: npx expo-doctor
      - name: Check mobile version
        run: npm run version:sync -w mobile -- --check
      - name: Smoke export mobile
        working-directory: mobile
        run: npx expo export --platform android --output-dir dist

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f backend/Dockerfile -t flux-ci .
      - name: Run healthcheck
        run: |
          docker run -d --name flux-smoke -p 18095:8080 \
            -v "$PWD/backend/configs/config.example.yaml:/app/configs/config.yaml:ro" \
            --tmpfs /app/data flux-ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18095/api/health; then exit 0; fi
            sleep 2
          done
          docker logs flux-smoke
          exit 1
