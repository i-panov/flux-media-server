rules:
  - id: flux-no-dynamic-code
    languages: [javascript, typescript]
    message: >
      Dynamic code evaluation is an XSS/prototype-pollution vector.
      Avoid eval/new Function/document.write/innerHTML in app code.
    severity: WARNING
    patterns:
      - pattern-either:
          - pattern: eval($X)
          - pattern: new Function($X)
          - pattern: document.write($X)
          - pattern: $X.innerHTML = $Y
          - pattern: "<$C dangerouslySetInnerHTML={$X} />"

  - id: flux-inline-http-client
    languages: [go]
    message: >
      Inline http.Client without project timeout/transport policy.
      Use the shared client/streamer helper and annotate allowlisted
      exceptions with // nosemgrep: flux-inline-http-client.
    severity: WARNING
    patterns:
      - pattern-either:
          - pattern: http.Client{}
          - pattern: "&http.Client{...}"
          - pattern: http.DefaultClient

  - id: flux-path-join-untrusted
    languages: [go]
    message: >
      filepath.Join with request/user-controlled input must be followed by
      IsSubPath/allowed-root validation before filesystem access.
    severity: WARNING
    patterns:
      - pattern: filepath.Join($BASE, $USER)
