version: "2"

run:
  timeout: 5m
  tests: false

# Профиль намеренно ужесточён по багам/security и не включает стилевые
# линтеры, которые на существующем коде давали >1000 замечаний
# (varnamelen/modernize/gci/lll/funlen/...). Стиль контролируют gofmt/gci
# в formatters, а новые стилевые правила можно включать точечно.
linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - bodyclose
    - noctx
    - nilerr
    - nilnil
    - errorlint
    - gosec
    - errchkjson
    - exhaustive
    - durationcheck

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false
      # Cleanup/close после основного результата: ошибка удаления временного
      # файла не должна менять ответ, но логируется там, где важна.
      exclude-functions:
        - os.Remove
        - (*os.File).Close
        - (io.Closer).Close
        - (*sql.DB).Close
        - fmt.Fprintf
        - (*github.com/go-sql-driver/mysql.DB).Close
        - (*github.com/valyala/fasthttp.URI).Parse
    errorlint:
      errorf: true
      errorf-multi: true
    exhaustive:
      default-signifies-exhaustive: true
    gosec:
      excludes:
        # G304 проверяется вручную: пути приходят из конфига/БД/очередей,
        # а web-раздача дополнительно валидирует IsSubPath.
        - G304
        # G204: ffmpeg/ffprobe запускаются с массивом аргументов без shell,
        # пути — внутренние. Это осознанный контракт сервиса.
        - G204
        # G104: ошибки cleanup (os.Remove/Close) логируются или не влияют
        # на результат; errcheck для значимых мест включён отдельно.
        - G104

  exclusions:
    rules:
      - linters: [errcheck, gosec]
        path: .*_test\.go

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
