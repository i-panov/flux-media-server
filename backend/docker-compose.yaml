services:
  flux-server:
    # Контекст — корень репозитория: образ собирает и Go-бинарник,
    # и веб-бандл (Node-стадия в Dockerfile), dist отдельно доставлять
    # не нужно. Локальная пересборка веба перекрывает запечённый бандл
    # маунтом: - ../web/dist:/app/web:ro
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: flux-media-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_PORT:-8095}:8095"
    volumes:
      - ${MEDIA_PATH}:/mnt/media/Flux:rw
      - ./configs/config.yaml:/app/configs/config.yaml:ro
    environment:
      - CONFIG_PATH=/app/configs/config.yaml
      - TZ=${TZ:-UTC}
    # Note: the server binds server.host from config.yaml. For container use
    # it must be "0.0.0.0" (publishing the port above only reaches a process
    # bound to all interfaces inside the container).
