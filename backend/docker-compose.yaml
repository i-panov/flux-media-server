services:
  flux-server:
    # Контекст — корень репозитория: образ собирает и Go-бинарник,
    # и веб-бандл (Node-стадия в Dockerfile), dist отдельно доставлять
    # не нужно. Локальная пересборка веба перекрывает запечённый бандл
    # маунтом: - ../web/dist:/app/web:ro
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: flux-media-server
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    ports:
      - "127.0.0.1:${HOST_PORT:-8095}:8080"
    volumes:
      # Данные сервера (SQLite, настройки, оригиналы, превью) — named
      # volume, иначе docker compose down создаёт новый пустой том.
      - flux-data:/app/data
      # Медиатека хоста в те же пути, что в config.example.yaml
      # (./data/video|audio|images относительно /app).
      - ${MEDIA_PATH:?set MEDIA_PATH in backend/.env}/video:/app/data/video:rw
      - ${MEDIA_PATH:?set MEDIA_PATH in backend/.env}/audio:/app/data/audio:rw
      - ${MEDIA_PATH:?set MEDIA_PATH in backend/.env}/images:/app/data/images:rw
      - ./configs/config.yaml:/app/configs/config.yaml:ro
    environment:
      - CONFIG_PATH=/app/configs/config.yaml
      - TZ=${TZ:-UTC}

  # Серверный загрузчик медиа. Тот же образ используется для API и worker:
  # API принимает POST /videos, worker выполняет yt-dlp/ffmpeg.
  media-loader:
    image: ghcr.io/i-panov/media-loader:0.1.0
    container_name: flux-media-loader
    restart: unless-stopped
    init: true
    depends_on:
      media-loader-redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${MEDIA_LOADER_PORT:-8097}:8000"
    environment:
      - REDIS_URL=redis://media-loader-redis:6379/0
      - DATA_DIR=/data
      - SERVER_TIMEZONE=${TZ:-Europe/Moscow}
      # Без byedpi: прямой yt-dlp. Для YouTube добавьте byedpi sidecar и
      # укажите PROXY_URL=socks5://byedpi:1080.
      - PROXY_URL=
      # Сервис доступен только на loopback. Для доступа из LAN включите
      # AUTH_ENABLED=true и создайте токен через media-loader-auth.
      - AUTH_ENABLED=false
    volumes:
      - media-loader-data:/data

  media-loader-worker:
    image: ghcr.io/i-panov/media-loader:0.1.0
    container_name: flux-media-loader-worker
    restart: unless-stopped
    init: true
    depends_on:
      media-loader-redis:
        condition: service_healthy
    command: ["arq", "media_loader.worker.WorkerSettings"]
    environment:
      - REDIS_URL=redis://media-loader-redis:6379/0
      - DATA_DIR=/data
      - SERVER_TIMEZONE=${TZ:-Europe/Moscow}
      - PROXY_URL=
      - AUTH_ENABLED=false
    volumes:
      - media-loader-data:/data

  media-loader-redis:
    image: redis:7-alpine
    container_name: flux-media-loader-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - media-loader-redis:/data

volumes:
  flux-data:
  media-loader-data:
  media-loader-redis:
