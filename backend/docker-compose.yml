services:
  flux-server:
    build: .
    container_name: flux-media-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - /path/to/your/media:/media:ro
      - ./configs/config.yaml:/app/configs/config.yaml:ro
    environment:
      - CONFIG_PATH=/app/configs/config.yaml
