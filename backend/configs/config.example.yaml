# Flux Media Server configuration.
# Copy this file to config.yaml and adjust. config.yaml is gitignored —
# never commit real secrets to the repository.

server:
  host: "0.0.0.0"
  port: 8080
  # env: "dev" is required when debug: true; everything else must be "production"
  env: "production"
  # debug: true returns OTP codes in API responses and enables verbose SQL
  # logging (including secrets). NEVER enable outside local development.
  debug: false
  cors_origins: "*"  # Set to your frontend origin in production
  # trusted_proxies: "127.0.0.1/32,10.0.0.0/8"  # X-Forwarded-For принимается только от этих CIDR
  # cookie_secure: true включает Secure-флаг у сессионных кук веб-клиента
  # (flux_access, flux_refresh). Нужен HTTPS; в LAN по HTTP оставьте false,
  # иначе браузер не будет отправлять куки.
  cookie_secure: false
  # IMPORTANT (memory): the HTTP engine (fasthttp) buffers the ENTIRE request
  # body of an upload in RAM before the handler runs. One upload consumes up
  # to max_upload_size of memory; budget RAM for (limit × concurrent uploads)
  # — concurrency is capped at 256 connections and the upload rate limiter
  # (rate_limiter.max) throttles request frequency. Applies to
  # /api/media/upload and cover endpoints; the rest of the API is capped at 4 MB.
  max_upload_size: 2147483648  # 2GB in bytes
  # web_dist: каталог собранного веб-клиента, раздаётся с того же
  # origin, что и API (SPA с fallback на index.html).
  # Пусто/закомментировано — API-only режим (разработка через Vite).
  # В Docker-образе бандл уже запечён в /app/web (Node-стадия
  # в backend/Dockerfile) — для него достаточно раскомментировать:
  # web_dist: "/app/web"
  # public_url: "https://flux.example.com"  # внешний URL для QR/device-code

database:
  path: "./data/flux.db"

auth:
  # Generate with: openssl rand -base64 48
  # The server refuses to start with this default value when debug is off.
  jwt_secret: "change-me-in-production-please-use-32-chars-min"
  jwt_expiry: 1        # access token lifetime, hours
  refresh_expiry: 720  # refresh token lifetime, hours (30 days)
  code_length: 6
  code_expiry: 300  # seconds
  max_otp_entries: 10000
  allowed_emails:
    - user1@example.com
    - user2@example.com
  # allow_unknown_email: true lets ANYONE register an account. The first
  # registered user becomes admin. Restrict this in production.
  allow_unknown_email: false
  smtp:
    host: "smtp.gmail.com"
    port: 587
    username: "your-email@gmail.com"
    password: "your-app-password"
    from: "Flux <noreply@example.com>"
    require_tls: true
    # implicit_tls: true  # SMTPS (e.g. port 465) — TLS before SMTP, no STARTTLS

scanner:
  enabled: true
  interval: 30
  watch_enabled: true  # auto-scan libraries on file system changes

rate_limiter:
  # Auth/upload/extract: строгий бюджет (OTP-брутфорс, multipart, ffmpeg).
  max: 10
  expiration: 60  # seconds
  # Чтения/стримы: щедрый отдельный бюджет — плеер при сиках шлёт
  # десятки range-запросов, общий бюджет 10/мин его бы душил.
  read_max: 600
  read_expiration: 60  # seconds
  # Массовая загрузка: отдельный бюджет. 0 — max × 12.
  upload_max: 300
  upload_expiration: 60  # seconds

media:
  thumbnail_path: "./data/thumbnails"
  video_path: "./data/video"
  audio_path: "./data/audio"
  # Мемы: jpg/jpeg/png/gif/webp/bmp. Пусто — config.Load подставит
  # ./data/images; сканер и загрузка кладут картинки сюда.
  image_path: "./data/images"

storage:
  # Карантин оригиналов: сюда падают все видеозагрузки до нормализации.
  # Сканер его игнорирует; удаление оригиналов — только руками админа
  # (или авточисткой ниже).
  originals_dir: "./data/originals"
  # Временные файлы транскода. Держите на быстром диске (рядом с БД):
  # чтение исходника и запись результата тогда идут параллельно.
  temp_dir: "./data/tmp"
  # auto_cleanup_originals: true разрешает удалять наименее смотримые
  # оригиналы с готовой копией, если иначе заливке не хватает места.
  # По умолчанию выключено.
  auto_cleanup_originals: false

transcode:
  # Домашний формат: H.264 + потолок 1080p. CRF 20 — прозрачно на ТВ,
  # preset влияет только на скорость счёта (считается один раз).
  # CRF 0 (lossless) запрещён: огромные файлы, браузеры не играют.
  crf: 20
  preset: "fast"  # ultrafast..placebo
  max_height: 1080
  # Оценка размера результата для проверки места: ×1.5 от исходника.
  estimate_factor: 1.5
  # Попыток на файл (первая + ретраи), дальше — статус error и ручной ретрай.
  max_attempts: 3
