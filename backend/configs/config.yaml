server:
    host: "0.0.0.0"
    port: 8080
    debug: true
    cors_origins: "*"
    max_upload_size: 2147483648  # 2GB in bytes

database:
    path: "./data/flux.db"

auth:
    jwt_secret: "change-me-in-production11111111111111111111111"
    jwt_expiry: 1          # access token: 1 hour
    refresh_expiry: 720    # refresh token: 30 days
    code_length: 6
    code_expiry: 300
    max_otp_entries: 10000
    allowed_emails:
        - user1@example.com
        - user2@example.com
    allow_unknown_email: true
    smtp:
        host: "smtp.gmail.com"
        port: 587
        username: "your-email@gmail.com"
        password: "your-app-password"
        from: "Flux <noreply@example.com>"

scanner:
    enabled: true
    interval: 30
    watch_enabled: true

media:
    thumbnail_path: "./data/thumbnails"
    video_path: "./data/video"
    audio_path: "./data/audio"
