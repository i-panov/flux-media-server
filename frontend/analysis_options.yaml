include: package:very_good_analysis/analysis_options.yaml

analyzer:
  errors:
    public_member_api_docs: ignore

  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.chopper.dart"
    - "**/*.gr.dart"
    - "build/**"
    - ".dart_tool/**"
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    public_member_api_docs: false
    lines_longer_than_80_chars: false
    require_trailing_commas: false
    avoid_print: false
    comment_references: false
    # Riverpod 3: family-провайдеры имеют internal-типы (*ProviderFamily),
    # явная аннотация тянет implementation-импорты — тип оставляем выведенным.
    specify_nonobvious_property_types: false
    # Массовый рефакторинг fire-and-forget вызовов (UI-колбэки) — вне объёма
    # миграции зависимостей; кандидат на отдельную задачу.
    discarded_futures: false
    unawaited_futures: false
    # Best-effort catch-all в сервисах (логирование, офлайн-фолбэки)
    # конфликтует с требованием on-клауз на каждое исключение.
    avoid_catches_without_on_clauses: false
    # Future-контракты репозиториев часто реализуются без await
    # (прокси-методы, кеш-хиты).
    async_return_with_no_await: false
    # Приватные поля сервисов (например _ref в OfflineCacheService) нельзя
    # указать именем super-параметра из другого файла — требование
    # совпадения имён невыполнимо без раскрытия приватности.
    matching_super_parameters: false