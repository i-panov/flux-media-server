include: package:very_good_analysis/analysis_options.yaml

analyzer:
  errors:
    public_member_api_docs: ignore

  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.chopper.dart"
    - "**/*.gr.dart"
    - "build/**"
    - ".dart_tool/**"
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    public_member_api_docs: false
    lines_longer_than_80_chars: false
    comment_references: false
    # Riverpod 3: family-провайдеры имеют internal-типы (*ProviderFamily),
    # явная аннотация тянет implementation-импорты — тип оставляем выведенным.
    specify_nonobvious_property_types: false
    # Best-practice catch-all в сервисах (логирование, офлайн-фолбэки)
    # конфликтует с требованием on-клауз на каждое исключение.
    avoid_catches_without_on_clauses: false
    # Приватные поля сервисов (например _ref в OfflineCacheService) нельзя
    # указать именем super-параметра из другого файла — требование
    # совпадения имён невыполнимо без раскрытия приватности.
    matching_super_parameters: false